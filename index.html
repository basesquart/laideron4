<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Joyeux Anniversaire Yse !</title>

  <!-- Google Font romantique -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Great Vibes', cursive;
      background: linear-gradient(to right, #ffccd5, #ffe6eb);
      color: #b30059;
      text-align: center;
      padding: 50px;
    }

    #content {
      display: none;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    #content.show {
      display: block;
      opacity: 1;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
      color: #ff4d88;
      text-shadow: 1px 1px #fff;
    }

    p {
      font-size: 1.5em;
    }

    .heart {
      font-size: 3em;
      animation: heartbeat 1s infinite;
      color: #ff1a75;
      margin: 20px 0;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
    }

    .footer {
      margin-top: 50px;
      font-size: 1.2em;
      color: #cc0066;
    }
  </style>

  <script>
    function checkAccess() {
      const inputName = prompt("Veuillez entrer votre prénom :");
      if (inputName && inputName.toLowerCase() === "yse") {
        document.getElementById("content").classList.add("show");
      } else {
        alert("Accès refusé. Dsl,ce site est réservé aux laiderons!");
        location.reload();
      }
    }

    window.onload = checkAccess;
  </script>
</head>

<body>
  <div id="content">
    <h1>Joyeux Anniversaire Yse !</h1>
    <div class="heart">❤️</div>
    <p>bonjour la moche.<br>
    Ce site a été fait avec tout plein d’amour juste pour toi.</p>

    <div class="footer">Aujourdhui, tu es grande....</div>
  </div>
</body>
</html>
