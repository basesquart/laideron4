<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Joyeux Anniversaire Yse !</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Great Vibes', cursive;
      background: linear-gradient(to right, #ffccd5, #ffe6eb);
      color: #b30059;
      text-align: center;
      padding: 50px;
      overflow: hidden;
    }

    #content {
      display: none;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    #content.show {
      display: block;
      opacity: 1;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
      color: #ff4d88;
      text-shadow: 1px 1px #fff;
    }

    p {
      font-size: 1.5em;
    }

    .heart {
      font-size: 3em;
      animation: heartbeat 1s infinite;
      color: #ff1a75;
      margin: 20px 0;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
    }

    .footer {
      margin-top: 50px;
      font-size: 1.2em;
      color: #cc0066;
    }

    .flower {
      position: fixed;
      top: -50px;
      font-size: 2em;
      animation: fall 10s linear infinite;
      pointer-events: none;
    }

    @keyframes fall {
      0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }

    audio {
      display: none;
    }
  </style>

  <script>
    function checkAccess() {
      const inputName = prompt("wsh t qui met ton prenom");
      if (inputName && inputName.toLowerCase() === "yse") {
        document.getElementById("content").classList.add("show");
        playMusic();
        generateFlowers();
      } else {
        alert("Accès refusé, dsl on accepte que les laiderons dans la team !");
        location.reload();
      }
    }

    function playMusic() {
      const music = document.getElementById("bg-music");
      music.play().catch(() => {
        console.log("Lecture automatique bloquée par le navigateur.");
      });
    }

    function generateFlowers() {
      const emojis = ["🌸", "🌺", "💮", "🌷", "🌹"];
      setInterval(() => {
        const flower = document.createElement("div");
        flower.classList.add("flower");
        flower.style.left = Math.random() * 100 + "vw";
        flower.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        document.body.appendChild(flower);
        setTimeout(() => flower.remove(), 10000);
      }, 300);
    }

    window.onload = checkAccess;
  </script>
</head>

<body>
  <audio id="bg-music" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
    Ton navigateur ne supporte pas l’audio HTML5.
  </audio>

  <div id="content">
    <h1>Joyeux Anniversaire Yse !</h1>
    <div class="heart">❤️</div>
    <p>TU ES GRANDE AUJOURD4HUI.<br>
  
    <div class="footer">Ysé j'ai quelque chose d'important a te dire..... Mais es-ce bien toi?</div>
  </div>
</body>
</html>
