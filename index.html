<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Bienvenue !</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #ffe6f0, #ffccda);
      text-align: center;
      padding: 100px 20px;
      color: #b30059;
    }

    h1 {
      font-size: 2.5em;
    }

    input, button {
      padding: 10px 15px;
      font-size: 1em;
      border-radius: 8px;
      border: none;
      margin-top: 20px;
    }

    #fleurs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .fleur {
      position: absolute;
      width: 30px;
      height: 30px;
      animation: tomber 10s linear infinite;
    }

    @keyframes tomber {
      to {
        transform: translateY(100vh);
      }
    }
  </style>
</head>
<body>

  <h1>Bienvenue sur le site secret...</h1>
  <p>Mais une question s’impose... <strong>Qui es-tu ?</strong></p>

  <input type="text" id="prenom" placeholder="Entre ton prénom ici">
  <br>
  <button onclick="verifier()">Entrer</button>

  <div id="fleurs"></div>

  <script>
    function verifier() {
      const nom = document.getElementById("prenom").value.toLowerCase().trim();
      if (nom === "yse") {
        window.location.href = "quiz.html";
      } else {
        alert("Tu n’es pas Yse !");
        window.close();
      }
    }

    function genererFleurs() {
      const conteneur = document.getElementById("fleurs");
      for (let i = 0; i < 30; i++) {
        const fleur = document.createElement("img");
        fleur.src = "https://i.imgur.com/NXqN9wv.png"; // petite fleur mignonne
        fleur.className = "fleur";
        fleur.style.left = Math.random() * 100 + "vw";
        fleur.style.top = Math.random() * -100 + "px";
        fleur.style.animationDuration = 5 + Math.random() * 5 + "s";
        conteneur.appendChild(fleur);
      }
    }

    genererFleurs();
  </script>

</body>
</html>
