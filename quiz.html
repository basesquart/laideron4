<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Es-tu vraiment Ysé ?</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-image: url('https://i.imgur.com/q1LB1Ec.png'); /* fond avec fleurs 💐 */
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-position: center;
      text-align: center;
      padding: 30px;
      color: #b30059;
      overflow-x: hidden;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 40px;
    }

    .question {
      margin: 40px 0;
    }

    .options button {
      background-color: #ff99c8;
      border: none;
      padding: 10px 20px;
      margin: 10px;
      font-size: 1em;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .options button:hover {
      background-color: #ff66a3;
      color: white;
    }

    #result {
      font-size: 1.8em;
      margin-top: 40px;
    }

    .hidden {
      display: none;
    }

    .confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ff99c8;
      animation: fall 3s linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
      }
    }

    #start-btn {
      background-color: #fff0f5;
      border: 2px solid #ff99c8;
      padding: 10px 20px;
      font-size: 1.2em;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 30px;
    }

  </style>
</head>
<body>

  <h1>Es-tu vraiment Ysé ? 💘</h1>

  <button id="start-btn" onclick="startQuiz()">Commencer 💫</button>

  <audio id="bg-music" loop>
    <source src="https://cdn.pixabay.com/audio/2023/02/07/audio_5811b4b6b4.mp3" type="audio/mpeg">
  </audio>

  <audio id="click-sound">
    <source src="https://cdn.pixabay.com/audio/2022/12/10/audio_35a0b2e5a1.mp3" type="audio/mpeg">
  </audio>

  <div class="question hidden" id="q1">
    <p>Quel est ton animal totem ?</p>
    <div class="options">
      <button onclick="fail()">Le chat</button>
      <button onclick="fail()">Le pâté en boîte</button>
      <button onclick="next('q1', 'q2')">Le rat</button>
    </div>
  </div>

  <div class="question hidden" id="q2">
    <p>Avec quel homme pourrais-tu te mettre en couple ?</p>
    <div class="options">
      <button onclick="fail()">Cet homme viril</button>
      <button onclick="next('q2', 'q3')">Un homme gay</button>
      <button onclick="fail()">Louis Fortin</button>
    </div>
  </div>

  <div class="question hidden" id="q3">
    <p>Quelle est ta destination de rêve ?</p>
    <div class="options">
      <button onclick="fail()">Un voyage uniquement avec Olive</button>
      <button onclick="next('q3', 'result')">La Turquie</button>
      <button onclick="fail()">Le cœur de Agathe</button>
    </div>
  </div>

  <div class="hidden" id="result">
    <p>OUI, tu es bien Ysé 💘</p>
    <p>Tu as réussi le test de l'amour</p>
    <div class="confetti" id="confetti-container"></div>
  </div>

  <script>
    const music = document.getElementById("bg-music");
    const clickSound = document.getElementById("click-sound");

    function startQuiz() {
      document.getElementById("start-btn").style.display = "none";
      document.getElementById("q1").classList.remove("hidden");
      music.play().catch(e => console.log("Pas pu jouer la musique : ", e));
    }

    function next(currentId, nextId) {
      clickSound.play();
      document.getElementById(currentId).classList.add('hidden');
      document.getElementById(nextId).classList.remove('hidden');
      if (nextId === "result") launchConfetti();
    }

    function fail() {
      clickSound.play();
      alert("FAUX. Vous n'êtes PAS Ysé 😤");
      window.close();
    }

    function launchConfetti() {
      const container = document.getElementById("confetti-container");
      for (let i = 0; i < 150; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti-piece");
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.top = Math.random() * -100 + "px";
        confetti.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 70%)`;
        container.appendChild(confetti);
        setTimeout(() => confetti.remove(), 3000);
      }
    }
  </script>
</body>
</html>
