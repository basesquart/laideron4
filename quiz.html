<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Es-tu vraiment Yse ?</title>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Patrick Hand', cursive;
      background: linear-gradient(to right, #ffd6e0, #ffe6f0);
      text-align: center;
      padding: 30px;
      color: #b30059;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
    }

    .question {
      margin: 30px 0;
    }

    .options button {
      background-color: #ff99c8;
      border: none;
      padding: 10px 20px;
      margin: 10px;
      font-size: 1em;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .options button:hover {
      background-color: #ff66a3;
      color: white;
    }

    img {
      width: 150px;
      height: auto;
      border-radius: 10px;
      margin-top: 10px;
    }

    #result {
      font-size: 1.8em;
      margin-top: 40px;
    }

    .hidden {
      display: none;
    }

    .confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ff99c8;
      animation: fall 3s linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <h1>Es-tu VRAIMENT Yse ?</h1>

  <div class="question" id="q1">
    <p>Quel est ton animal totem ?</p>
    <div class="options">
      <button onclick="fail()">Le chat</button>
      <button onclick="fail()">Le pâté en boîte</button>
      <button onclick="next('q1', 'q2')">Le rat</button>
    </div>
  </div>

  <div class="question hidden" id="q2">
    <p>Avec quel homme pourrais-tu te mettre en couple ?</p>
    <img src="https://i.imgur.com/3jLPB46.png" alt="homme viril"><br>
    <button onclick="fail()">Cet homme viril</button><br><br>
    <img src="https://i.imgur.com/x9q5aFp.png" alt="homme gay"><br>
    <button onclick="next('q2', 'q3')">Cet homme gay</button><br><br>
    <button onclick="fail()">Louis Fortin</button>
  </div>

  <div class="question hidden" id="q3">
    <p>Quelle est ta destination de rêve ?</p>
    <button onclick="fail()">Un voyage uniquement avec Olive</button>
    <button onclick="next('q3', 'result')">La Turquie</button>
    <button onclick="fail()">Le cœur de Agathe</button>
  </div>

  <div class="hidden" id="result">
    <p>BRAVO YSE !! Tu es toi-même... Tu peux maintenant pleurer de joie.</p>
    <div class="confetti" id="confetti-container"></div>
  </div>

  <script>
    function next(currentId, nextId) {
      document.getElementById(currentId).classList.add('hidden');
      const nextEl = document.getElementById(nextId);
      nextEl.classList.remove('hidden');
      if (nextId === "result") launchConfetti();
    }

    function fail() {
      alert("Non non non… tu n'es pas Yse. Le site va se fermer !");
      window.close();
    }

    function launchConfetti() {
      const container = document.getElementById("confetti-container");
      for (let i = 0; i < 150; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti-piece");
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.top = Math.random() * -100 + "px";
        confetti.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 70%)`;
        container.appendChild(confetti);
        setTimeout(() => confetti.remove(), 3000);
      }
    }
  </script>

</body>
</html>
