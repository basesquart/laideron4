<body onclick="startMusic()">

  <h1>Es-tu vraiment Ysé ? 💗</h1>

  <audio id="music" loop>
    <source src="https://cdn.pixabay.com/audio/2023/02/07/audio_5811b4b6b4.mp3" type="audio/mpeg">
    Ton navigateur ne supporte pas l'audio.
  </audio>

  <audio id="click-sound">
    <source src="https://cdn.pixabay.com/audio/2022/12/10/audio_35a0b2e5a1.mp3" type="audio/mpeg">
  </audio>

  <!-- (les questions ici comme avant) -->

  <script>
    const clickSound = document.getElementById("click-sound");
    const bgMusic = document.getElementById("music");
    let musicStarted = false;

    function startMusic() {
      if (!musicStarted) {
        bgMusic.play().catch(e => console.log("Audio bloqué 😓"));
        musicStarted = true;
      }
    }

    function next(currentId, nextId) {
      clickSound.play();
      document.getElementById(currentId).classList.add('hidden');
      const nextEl = document.getElementById(nextId);
      nextEl.classList.remove('hidden');
      if (nextId === "result") launchConfetti();
    }

    function fail() {
      clickSound.play();
      alert("FAUX. Vous n'êtes PAS Ysé 😤");
      window.close();
    }

    function launchConfetti() {
      const container = document.getElementById("confetti-container");
      for (let i = 0; i < 150; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti-piece");
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.top = Math.random() * -100 + "px";
        confetti.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 70%)`;
        container.appendChild(confetti);
        setTimeout(() => confetti.remove(), 3000);
      }
    }
  </script>
</body>
